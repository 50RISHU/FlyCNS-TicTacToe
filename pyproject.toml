[project]
name = "flycns-tictactoe"
version = "0.1.0"
description = "A connectome-based Tic-Tac-Toe agent using the Drosophila MaleCNS."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.6.1",
    "neuprint-python>=0.6.3",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flycns"]
